name: APEX static validation and fixture smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Validate manifests and skill contracts
        run: python tests/validate_skills.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Promptfoo Echo fixture checks (no LLM API calls)
        run: npx --yes promptfoo@latest eval -c evals/promptfooconfig.yaml -o reports/promptfoo-echo.json
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-static-fixture-results
          path: reports/
          if-no-files-found: warn
